services:
  tide:
    image: afbeals/tide:latest
    build:
      context: .
    container_name: tide
    restart: unless-stopped
    ports:
      - "8776:8776"
    volumes:
      - /mnt/user/appdata/tide/data:/app/data
    environment:
      TIDE_DATA_DIR: /app/data
      DATABASE_URL: file:/app/data/workspace.db
      TIDE_GOOGLE_MODE: ${TIDE_GOOGLE_MODE:-disabled}
      GOOGLE_SERVER_API_KEY: ${GOOGLE_SERVER_API_KEY:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
      TIDE_SEED_DEMO: ${TIDE_SEED_DEMO:-false}
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8776]/"
